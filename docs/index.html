<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador empresas vs screener</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Comparador empresas vs screener</h1>

<div>
  <label for="ticker">Ticker de empresas </label>
  <input type="text" id="ticker" value="AAPL" placeholder="AAPL, MSFT, GOOG">
</div>

<div>
  <label for="screenerSelect">Selecciona Screener </label>
  <select id="screenerSelect"></select>
  <input type="text" id="customURL" placeholder="Introduce URL" style="display:none; width:80%;">
</div>

<button id="compareBtn">&#128269; Comparar</button>

<div id="resumen"></div>

<div class="tabla-scroll">
<table id="resultsTable">
  <thead></thead>
  <tbody></tbody>
</table>
</div>

<pre id="log"></pre>

<script src="logica.js"></script>
<script src="app.js"></script>
</body>
</html>
